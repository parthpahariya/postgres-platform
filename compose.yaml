# One PostgreSQL server shared by the workspace apps (rental-review, wardrobe-manager).
# Apps never start this directly: their `make up` / deploy runs bin/ensure-db, which
# starts it if needed and creates the app's database and roles.
name: postgres-platform

services:
  postgres:
    # Same version as meal-manager, so every app tests and runs on one PostgreSQL.
    image: ${POSTGRES_IMAGE:-postgres:18.6-bookworm}
    container_name: shared-postgres
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Run bin/ensure-db or make up to create .env}
      POSTGRES_DB: postgres
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - shared_buffers=192MB
      - -c
      - max_connections=60
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - jit=off
    volumes:
      - data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 24
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-640m}
    memswap_limit: ${POSTGRES_MEMORY_LIMIT:-640m}
    shm_size: 128m
    stop_grace_period: 30s
    restart: unless-stopped
    networks: [shared]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Holds every app's data. `make down` never removes it.
  data:

networks:
  shared:
    # Fixed name so app projects can join it as an external network.
    name: shared-postgres
